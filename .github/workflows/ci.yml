name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BarcodeApp.sln

      - name: Build
        run: dotnet build BarcodeApp.sln --no-restore -c Release

      - name: Test
        run: dotnet test BarcodeApp.sln --no-build -c Release --verbosity normal

      - name: UI smoke tests (headless)
        run: dotnet test BarcodeApp.SmokeTests/BarcodeApp.SmokeTests.csproj -c Release --verbosity normal
